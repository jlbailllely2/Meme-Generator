<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meme Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1 class="page-title">Meme Generator</h1>
    </header>

    <section class="card controls-card">
      <div class="controls-row">
        <label class="file-label">
          <input type="file" id="imageInput" accept="image/*" class="file-input" />
          <span class="btn btn-secondary">Choose Image</span>
        </label>
        <button type="button" id="randomBtn" class="btn btn-random">🎲 Random Meme</button>
        <div class="size-control">
          <label for="sizeSlider" class="label">Text size</label>
          <div class="slider-row">
            <input type="range" id="sizeSlider" min="12" max="120" value="48" step="2" class="slider" />
            <span id="sizeValue" class="size-value">48px</span>
          </div>
        </div>
        <div class="color-control">
          <label for="textColor" class="label">Text color</label>
          <input type="color" id="textColor" value="#ffffff" class="color-input" />
        </div>
      </div>

      <div class="text-layers-panel">
        <div class="text-layers-header">
          <label class="label">Text layers</label>
          <span class="text-layers-hint">Click image to place text</span>
        </div>
        <div id="textLayersList" class="text-layers-list"></div>
      </div>
    </section>

    <section class="card gallery-card">
      <div class="gallery-header">
        <label class="label">Choose a template</label>
        <span class="gallery-count" id="galleryCount"></span>
      </div>
      <input type="text" id="gallerySearch" class="text-field gallery-search" placeholder="Search templates..." autocomplete="off" />
      <div class="gallery-grid" id="galleryGrid"></div>
    </section>

    <section class="card canvas-card">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="memeCanvas"></canvas>
        <div class="canvas-placeholder" id="canvasPlaceholder">
          Choose an image to get started
        </div>
        <div id="textEditOverlay" class="text-edit-overlay" hidden>
          <input type="text" id="textEditInput" class="text-edit-input" placeholder="Type and press Enter..." maxlength="200" autocomplete="off" />
        </div>
      </div>
      <button type="button" id="downloadBtn" class="btn btn-primary" disabled>
        Download Meme
      </button>
      <p class="canvas-hint">Click image to add text &middot; Drag to reposition &middot; Click layer to resize/recolor</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
